<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 520px; margin: 0; padding: 10px; font: 13px system-ui, sans-serif; }
  header { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea { width: 100%; height: 420px; box-sizing: border-box; font: 12px monospace; resize: vertical; }
  small { color: #666; }
</style>
<header>
  <span id="title">…</span>
  <button id="copy" disabled>Copy</button>
  <button id="save" disabled>Download .md</button>
</header>
<textarea id="md" readonly></textarea>
<small>Shows the messages that have been on screen. For more, scroll the chat up and open the popup again.</small>
<script src="popup.js"></script>
